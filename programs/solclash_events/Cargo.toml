[package]
name = "solclash-events"
description = "Binary Yes/No, P2P, non-custodial, variable-stake pari-mutuel prediction market on Solana, settled from a Pyth price update."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "solclash_events"

[features]
# `oracle-mock` is ON by default: Fase 1 has exactly one price source, the
# mock in `oracle::mock`, and `instructions/resolution.rs` names
# `MockPriceUpdate` unconditionally. A build without it does not compile,
# which is the honest state of this phase — there is no real Pyth path yet.
# Fase 3 adds the real `PriceUpdateV2` path and flips this default.
default = ["oracle-mock"]
oracle-mock = []
# `mainnet` is deliberately unbuildable today: it collides with
# `oracle-mock` through the `compile_error!` guard in lib.rs, and
# `--no-default-features --features mainnet` leaves resolution.rs without a
# price-update account type. That is the guard doing its job, not a defect.
mainnet = []

no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
# Declared so `#[program]`/`#[derive(Accounts)]`, which expand to
# `cfg(feature = "...")` on all three, do not trip `unexpected_cfgs`.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
# Test-only, never linked into the on-chain binary. Used solely to read
# `tests/fixtures/*.json` back in and diff them against math.rs, which is
# the whole point of those files existing. The "only three direct
# dependencies" rule in README.md is about what ships on-chain.
serde_json = "1"

# `cfg(target_os = "solana")` is emitted by anchor's macros for the SBF
# target, which rustc's built-in target list does not know about on a host
# build. Declaring it here is the standard way to keep `cargo build`/
# `cargo clippy` warning-clean without silencing real cfg typos.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
