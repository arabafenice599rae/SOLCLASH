# Anchor workspace manifest. Written in Fase 0, against a toolchain that
# actually exists — see TOOLCHAIN.md for the exact versions this was
# verified with.

[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# PLACEHOLDER program id, matching `declare_id!` in
# programs/solclash_events/src/lib.rs. No keypair exists for it — it is a
# hash, not an address anybody can sign for. Deploying requires generating
# a real keypair (`solana-keygen new -o target/deploy/solclash_events-keypair.json`)
# and running `anchor keys sync`; that is deliberately NOT done here, so the
# repository never implies an ownership it does not have. See DEPLOY.md.
solclash_events = "6aFse5Z9e6M97Hcro492hcb9b8sdkvZJ2zBHAGUdwBb1"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
